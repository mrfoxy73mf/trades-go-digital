  <text x="90" y="518" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">£1,245</text>
  <text x="90" y="544" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="12">Sample month remittance</text>
  <rect x="338" y="450" width="254" height="120" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="360" y="490" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Open approvals</text>
  <text x="360" y="518" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">1</text>
  <text x="360" y="544" fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="12">Review in portal</text>
  <rect x="68" y="600" width="524" height="120" rx="12" fill="#FAF7F2" stroke="#E7E0D5"/>
  <text x="90" y="646" fill="#101A2E" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Secure landlord access</text>
  <text x="90" y="674" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Landlords see only their properties and approvals.</text>
  <rect x="660" y="40" width="580" height="720" rx="18" fill="#FFFFFF" stroke="#E7E0D5"/>
