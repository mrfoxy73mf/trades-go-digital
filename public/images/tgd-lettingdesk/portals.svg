<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="LettingDesk landlord and tenant portals">
  <rect width="1280" height="800" fill="#FAF7F2"/>
  <rect x="40" y="40" width="580" height="720" rx="18" fill="#FFFFFF" stroke="#E7E0D5"/>
