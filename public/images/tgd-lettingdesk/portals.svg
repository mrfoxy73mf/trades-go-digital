  <text x="710" y="278" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Describe the problem and upload photos.</text>
  <rect x="710" y="298" width="160" height="28" rx="8" fill="#2563EB"/>
  <text x="740" y="317" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">New request</text>
  <rect x="688" y="360" width="524" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="710" y="400" fill="#101A2E" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Open request · Kitchen tap drip</text>
  <text x="710" y="428" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Status: contractor scheduled</text>
  <rect x="688" y="480" width="524" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="710" y="520" fill="#101A2E" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Documents</text>
  <text x="710" y="548" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">How-to-rent guide · Inventory summary</text>
  <rect x="688" y="600" width="524" height="120" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="710" y="646" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tenant and landlord portals stay connected</text>
  <text x="710" y="674" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="13">to the agency work queue and paperwork.</text>
</svg>
