  <text x="688" y="178" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Requests, updates and documents</text>
  <rect x="688" y="210" width="524" height="130" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
