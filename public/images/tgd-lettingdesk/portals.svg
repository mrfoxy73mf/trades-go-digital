  <text x="90" y="276" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Quote awaiting your approval · Boiler service</text>
  <rect x="68" y="330" width="524" height="100" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="90" y="368" fill="#101A2E" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">9 Oak Avenue, York</text>
  <text x="90" y="396" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Job in progress · Leak investigation</text>
